<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推しチャット</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #111;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}
.msg {
  margin: 6px 0;
}
.user { text-align: right; }
.ai { text-align: left; }#inputArea { display: flex; } input { flex: 1; padding: 10px; font-size: 16px; border: none; } button { padding: 10px; font-size: 16px; background: #444; color: white; border: none; } </style>

</head>
<body><div id="chat"></div><div id="inputArea">
  <input id="input" placeholder="話しかける…">
  <button onclick="send()">送信</button>
</div><script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

// 推しキャラの口調（ここ変えられる！）
function aiReply(userText) {
  const replies = [
    "……そうか",
    "お前、変なこと言うな",
    "別に嫌いじゃない",
    "それで？",
    "俺に何求めてるんだ？",
    "まあいいけど",
    "ちゃんと寝てるか？",
    "無理すんなよ"
  ];

  return replies[Math.floor(Math.random() * replies.length)];
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function send() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(() => {
    const reply = aiReply(text);
    addMessage(reply, "ai");
  }, 400);
}
</script></body>
</html>
